<script>
        // Simple toggle logic for the day buttons
        document.querySelectorAll('button').forEach(button => {
            if(button.textContent.length === 1 && !button.closest('header')) {
                button.addEventListener('click', function() {
                    this.classList.toggle('bg-primary');
                    this.classList.toggle('text-on-primary');
                    this.classList.toggle('border-primary');
                    
                    this.classList.toggle('bg-surface-container-lowest');
                    this.classList.toggle('text-on-surface');
                    this.classList.toggle('border-outline-variant');
                });
            }
        });
