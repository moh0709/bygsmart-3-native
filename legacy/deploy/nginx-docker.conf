# ============================================================
# Nginx config for Docker container (HTTP only, port 80)
# SSL is handled by the VPS host Nginx (see nginx-vps-proxy.conf)
#
# PRODUCTION ONLY — do not use this config in front of the Vite dev server.
# The SPA fallback (try_files ... /index.html) serves the raw index.html
# template, bypassing Vite's %BASE_URL% substitution. In development, proxy
# /byggeapp/ directly to the Vite dev server (port 3000) via nginx-vps-proxy.conf.
# ============================================================

# ── Security headers (F-03) ───────────────────────────────────────────────────
# Authoritative for the SPA. Because nginx DROPS all inherited `add_header`
# directives in any location that declares its own, the security set is repeated
# (via the snippet below) in the asset and sw.js locations that set Cache-Control.
#
# CSP notes:
#   - script-src 'self'  → the app ships bundled JS only (no inline <script>),
#     plus js.stripe.com for forward-compatibility with Stripe.js.
#   - style-src 'unsafe-inline' → Tailwind + framer-motion/three inject inline
#     styles at runtime; scripts stay strict.
#   - worker-src blob: → three.js/WebGL loaders spawn blob workers.
#   - img-src data: blob: → html2canvas/jspdf canvas exports.
#   - connect-src → Supabase REST + realtime (wss), same-origin /api, Stripe,
#     Sentry ingest.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;

    # ── Security headers — applied to all responses served directly from here ──
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://js.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pkzburssqetnlcbvabdq.supabase.co; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://pkzburssqetnlcbvabdq.supabase.co wss://pkzburssqetnlcbvabdq.supabase.co https://api.stripe.com https://js.stripe.com https://checkout.stripe.com https://*.ingest.sentry.io https://challenges.cloudflare.com; frame-src https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com; manifest-src 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    # Proxy API requests to the backend container in docker-compose
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed assets forever.
    # Re-declares the security headers because the local add_header (Cache-Control)
    # would otherwise reset the inherited server-level set.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://js.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pkzburssqetnlcbvabdq.supabase.co; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://pkzburssqetnlcbvabdq.supabase.co wss://pkzburssqetnlcbvabdq.supabase.co https://api.stripe.com https://js.stripe.com https://checkout.stripe.com https://*.ingest.sentry.io https://challenges.cloudflare.com; frame-src https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com; manifest-src 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
        access_log off;
    }

    # Service worker: never cache.
    # Re-declares the security headers for the same inheritance-reset reason.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://js.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pkzburssqetnlcbvabdq.supabase.co; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://pkzburssqetnlcbvabdq.supabase.co wss://pkzburssqetnlcbvabdq.supabase.co https://api.stripe.com https://js.stripe.com https://checkout.stripe.com https://*.ingest.sentry.io https://challenges.cloudflare.com; frame-src https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com; manifest-src 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
