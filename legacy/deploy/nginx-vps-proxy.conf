# ============================================================
# Host Nginx config (vps2) - reverse proxy for omniware.dk/byggeapp
# Place this at: /etc/nginx/sites-available/bygsmart-omniware
# Then: sudo ln -sf /etc/nginx/sites-available/bygsmart-omniware /etc/nginx/sites-enabled/
#
# The public TLS edge for omniware.dk may be handled in front of this Nginx.
# Keep ALLOWED_ORIGIN=https://omniware.dk in the API environment.
# ============================================================

# Edge rate limiting for the API (defense-in-depth in front of the app's own
# per-user express-rate-limit). This file is included inside the http{} block
# via sites-enabled, so this zone declaration is valid here. Coarse per-IP cap
# to blunt L7 floods; burst absorbs legitimate spikes.
limit_req_zone $binary_remote_addr zone=bygsmart_api_edge:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name omniware.dk www.omniware.dk;

    client_max_body_size 50M;

    # ── Security headers (F-03) ───────────────────────────────────────────────
    # Strict-Transport-Security is owned by the TLS edge: strip whatever the
    # upstreams (SPA container + Express/Helmet) send and emit a single canonical
    # value here so HSTS is consistent on every response. The remaining headers
    # (CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy,
    # Permissions-Policy) are produced by those upstreams — deploy/nginx-docker.conf
    # for the SPA and Helmet for /api — and pass through this proxy unchanged.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Block access to dotfiles (.env, .git, …) at the proxy edge as well as in
    # the container, so a misrouted request can never surface secrets.
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /byggeapp {
        return 301 /byggeapp/;
    }

    location /byggeapp/api/ {
        limit_req zone=bygsmart_api_edge burst=40 nodelay;
        proxy_pass http://127.0.0.1:3031/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Backward-compatible API path used by the current frontend fetch calls.
    location /api/ {
        limit_req zone=bygsmart_api_edge burst=40 nodelay;
        proxy_pass http://127.0.0.1:3031/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3030/assets/;
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:3030/manifest.json;
    }

    location = /pwa-icon.svg {
        proxy_pass http://127.0.0.1:3030/pwa-icon.svg;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3030/sw.js;
    }

    location /__vite_hmr {
        proxy_pass http://127.0.0.1:3000/__vite_hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # PRODUCTION: serves pre-built static files from the Docker container (port 3030).
    # DEVELOPMENT: replace the proxy_pass target with http://127.0.0.1:3000/ to forward
    # all /byggeapp/ requests to the Vite dev server so %BASE_URL% substitution in
    # index.html is performed by Vite rather than serving the raw template statically.
    location /byggeapp/ {
        proxy_pass http://127.0.0.1:3030/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
