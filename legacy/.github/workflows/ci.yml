name: CI / CD

# ============================================================================
# Branch protection (manual GitHub setting — cannot be set programmatically):
# In Settings → Branches → add a rule for `main` and mark these checks as
# "Required": quality, build, e2e_smoke, secret_scan, sast,
# dependency_scan, dockerfile_lint, container_scan. The `deploy` job already
# gates on them via `needs:`, but branch protection is what blocks merges to
# `main` when a security check fails. Also enable
# Settings → Code security → "Push protection" for secret scanning.
# ============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: 'Run full authenticated E2E flows (requires E2E secrets)'
        required: false
        default: false
        type: boolean

# Least privilege: jobs only read the repo. Security jobs report inline
# (fail the build) rather than writing to code scanning / issues.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e_smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PORT: '4174'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

  e2e_full:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.E2E_LOGIN_IDENTIFIER != '' && secrets.E2E_PASSWORD != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_full_e2e == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_FULL: '1'
          E2E_PORT: '4174'
          E2E_LOGIN_IDENTIFIER: ${{ secrets.E2E_LOGIN_IDENTIFIER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

  # ==========================================================================
  # Security scanning (F-07) — all free / OSS tooling, no paid licenses.
  # Each scanner is its own job so a failure is clearly attributable.
  # ==========================================================================

  # Secret scanning across the FULL git history. Fails on any finding.
  secret_scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so leaks in old commits are caught
      - name: Install Gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # Static analysis (SAST) with Semgrep OSS community rulesets.
  # Fails on high-severity (ERROR) findings.
  sast:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/react \
            --config p/typescript \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --metrics off \
            --exclude dist --exclude coverage --exclude node_modules
        env:
          SEMGREP_SEND_METRICS: "off"

  # Dependency CVE scanning: OSV-Scanner (lockfiles) + Trivy filesystem.
  # `npm audit --audit-level=high` also still runs in the `quality` job.
  dependency_scan:
    name: Dependency CVE scan (OSV + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV-Scanner
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" \
            -o osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
      - name: OSV-Scanner (root + server lockfiles)
        run: |
          osv-scanner \
            --lockfile=package-lock.json \
            --lockfile=server/package-lock.json
      - name: Trivy filesystem scan (deps + misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,dist,coverage

  # Lint BOTH Dockerfiles. Only errors block (warnings are advisory).
  dockerfile_lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, server/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: error

  # IaC scan of Dockerfiles + docker-compose. Report-only (soft fail) so it
  # surfaces misconfigurations without breaking the existing deploy flow.
  iac_scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (Dockerfile + docker-compose)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,docker_compose
          quiet: true
          soft_fail: true

  # Build BOTH images and scan them with Trivy. Fails on fixable HIGH/CRITICAL.
  container_scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: dockerfile_lint
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=ci-dummy-anon-key \
            -t bygsmart-web:scan .
      - name: Build api image
        run: docker build -f server/Dockerfile -t bygsmart-api:scan server
      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bygsmart-web:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy scan api image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bygsmart-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # DAST: OWASP ZAP baseline against the built static SPA. Report-only — it
  # always runs and publishes findings (artifact) but does not block deploy.
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Serve static build
        run: |
          npx --yes serve -s dist -l 8080 &
          npx --yes wait-on -t 60000 http://localhost:8080
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: '-I'
          fail_action: false
          allow_issue_writing: false

  deploy:
    runs-on: ubuntu-latest
    # Gate deploy on the blocking security checks as well as quality/build/e2e.
    # (iac_scan and dast are report-only and intentionally not gating.)
    needs: [quality, build, e2e_smoke, secret_scan, sast, dependency_scan, dockerfile_lint, container_scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            -t bygsmart-web:${{ github.sha }} .
      - name: Build api image
        run: |
          docker build -f server/Dockerfile -t bygsmart-api:${{ github.sha }} server
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bygsmart
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
